name: Publish Release (Maven Central)

on:
  release:
    types: [published, released]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build & Publish KMP Artifacts
    runs-on: macos-latest
    environment: PRODUCTION # Secure deployment environment map

    env:
      # Handshaking your exact repository secrets to the Gradle environment
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'amazon'
          java-version: '21'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Grant Permission to Execute Gradle
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      # ⚡ Pro-Tip: Reusing compiled native toolchains cuts macOS runner consumption significantly
      - name: Cache Kotlin Native Compiler Data
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Publish To Maven Central
        run: |
          ./gradlew publishAllPublicationsToMavenCentralRepository --no-daemon --no-configuration-cache --stacktrace