# ====================================================================
#  Contexture Workspace Scope Configuration Profile (Verbatim Ecosystem)
# ====================================================================

# Core Engine Infrastructure Libraries
# These modules represent the primary, platform-agnostic business logic architectures.
coreModules=verbatim-core,verbatim-crashlytics,verbatim-middleware,verbatim-tracing,verbatim-persistence,verbatim-ktor,verbatim-ui,verbatim-compiler-plugin

# Showcase & Application Playground targets
# These modules house your Multiplatform UI clients, demonstration hubs, and targets.
demoModules=app

# Default Operational Token Threshold Capacity Allocation
# Scales your diagnostics dashboard telemetry alerts dynamically.
maxTokens=150000

# Target File Extension Extraction Matrix Boundaries
# Determines which file vectors are ingested into your prompt generation queues.
allowedExtensions=kt,kts,xml,properties,json,md,toml,yaml,env,conf,local,pem,key,keystore,p12

# Global Filesystem Traversal Exclusions
# Explicitly isolates build targets, IDE state data, and caching folders.
ignoredDirectories=.git,.gradle,.idea,buildSrc,bin,out
